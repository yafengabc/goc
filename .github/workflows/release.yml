name: Release

# Tag-triggered release build. Pushing a v* tag (e.g. v0.0.1) builds the
# Windows toolchain binaries, cross-compiles the Linux ones, checksums them
# and creates a GitHub Release with release notes from
# .github/release-notes/<tag>.md (committed BEFORE the tag is pushed).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # required to create the Release

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # runner default on Windows is pwsh; build.sh needs bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs tags -> full history
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: build (Windows toolchain)
        run: bash build.sh

      - name: cross-compile Linux toolchain
        run: |
          V="$(git describe --tags --always)"
          # goc's main lives in src/ (package main, selected by -tags goc), the
          # old command built the library package src/goc which produces no
          # binary. goc derives its version from git at run time, so no -X is
          # needed here (only gocl stamps via -X gocl.version).
          #
          # gocld/cc are cross-compiled too so the Linux zip carries the core
          # toolchain (cc is just goc under a gcc-compatible name). gocl is
          # intentionally NOT cross-compiled here: it needs libLLVM.so at run
          # time, which is not shipped in the Linux zip (only the Windows zip
          # gets libLLVM.dll, uploaded separately from a local copy).
          # elfcheck/msgboxcheck are test/diagnostic tools and are not
          # published in either zip.
          (cd src && GOOS=linux go build -trimpath -ldflags="-s -w" -o ../bin/goc-linux -tags goc .)
          (cd src && cp ../bin/goc-linux ../bin/cc-linux)
          (cd src/gocld && GOOS=linux go build -trimpath -ldflags="-s -w" -o ../../bin/gocld-linux ./cmd/gocld)
          (cd src/goa && GOOS=linux go build -trimpath -ldflags="-s -w" -o ../../bin/goa-linux ./cmd/goa)
          ls -l bin/

      - name: package + checksums
        # Versioned zips, plain names INSIDE. goc's findGoa looks for
        # "goa.exe"/"goa" NEXT TO the goc executable, so inside a zip the
        # files are bare (goc.exe/cc.exe/goa.exe or goc/goa) and the version
        # lives in the zip filename — a downloaded+unzipped toolchain just
        # works. Python zipfile is used on purpose: Git Bash `tar -a` and
        # plain `cp` of extension-less files into a dir that already holds
        # e.g. goc.exe have known path-mangling bugs (MSYS EXEPATH).
        #
        # The zip/release filename uses the triggering tag ($GITHUB_REF_NAME),
        # NOT `git describe`: both v0.2.0 and v0.2.1 may point at the same
        # commit, and git describe would then stamp every zip with the same
        # (alphabetically-first) tag, so the v0.2.1 release would ship files
        # named v0.2.0.
        run: |
          V="$GITHUB_REF_NAME"
          mkdir -p build/win build/linux release
          # Windows toolchain: the compilers/assembler/linker build.sh produces
          # (goc/gocl/gocld/cc/goa). elfcheck/msgboxcheck are test/diagnostic
          # tools and are not published. libLLVM.dll is NOT copied here -- it is
          # a prebuilt dependency, not compiled by CI, and is uploaded
          # separately from a local copy after the release is made.
          cp bin/goc.exe         build/win/goc.exe
          cp bin/gocl.exe        build/win/gocl.exe
          cp bin/gocld.exe       build/win/gocld.exe
          cp bin/cc.exe          build/win/cc.exe
          cp bin/goa.exe         build/win/goa.exe
          # Linux toolchain (native x86-64 back end): goc/gocld/cc/goa. gocl is
          # omitted -- it needs libLLVM.so at run time, which this zip does not
          # ship. elfcheck is a test tool and is not published.
          cp bin/goc-linux      build/linux/goc
          cp bin/cc-linux       build/linux/cc
          cp bin/gocld-linux    build/linux/gocld
          cp bin/goa-linux      build/linux/goa
          cp README.md build/win/README.md
          cp README.md build/linux/README.md
          cp LICENSE build/win/LICENSE
          cp LICENSE build/linux/LICENSE
          # goclib/ travels with the compiler. It is read from disk at run
          # time (src/goc/libfs.go), so a zip without it yields a goc that
          # fails on the first program with "cannot find the goclib C library".
          # Copy the tree, not a wildcard: os.listdir below only writes files.
          rm -rf build/win/goclib build/linux/goclib
          cp -r src/goclib build/win/goclib
          cp -r src/goclib build/linux/goclib
          python - "$V" <<'PY'
          import os, sys, zipfile
          V = sys.argv[1]
          def z(d, out):
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for f in sorted(os.listdir(d)):
                      p = os.path.join(d, f)
                      if os.path.isfile(p):
                          zf.write(p, arcname=f)
                      elif os.path.isdir(p):
                          # goclib/ -- the C library, which the compiler reads
                          # from disk. Recurse; a flat copy would leave the
                          # headers behind and every #include <stdio.h> would
                          # fall through to "skipping unavailable system
                          # header", producing a compiler that builds but
                          # cannot printf.
                          for root, _, files in os.walk(p):
                              rel = os.path.relpath(root, d)
                              for n in sorted(files):
                                  zf.write(os.path.join(root, n),
                                           arcname=os.path.join(rel, n).replace(os.sep, '/'))
              print('->', out, len(zipfile.ZipFile(out).namelist()), 'entries')
          z('build/win',   'release/goc-%s-windows-x86_64.zip' % V)
          z('build/linux', 'release/goc-%s-linux-x86_64.zip' % V)
          PY
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
          gh release view "$GITHUB_REF_NAME" --json name,tagName,assets --jq '{name, tagName, assets: [.assets[].name]}'
