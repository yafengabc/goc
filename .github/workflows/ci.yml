name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Linux: prove both modules compile and are gofmt-clean, then RUN the
    # Linux ELF targets on the real kernel (run_tests_linux.sh) -- the only
    # true check for the SSE2 double codegen, no elfcheck interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: gofmt
        run: |
          out="$(gofmt -l . tools/elfcheck tools/msgboxcheck)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          (cd src && go vet ./...)
          (cd src/goa && go vet ./...)
          (cd tools && go vet ./...)
      - name: go build
        run: |
          mkdir -p bin
          (cd src && go build -o ../bin/goc .)
          (cd src/goa && go build -o ../../bin/goa .)
          (cd tools && go build ./elfcheck)
          # msgboxcheck drives a real Windows dialog box, so it only exists as
          # a Windows program: building it here without GOOS fails with "build
          # constraints exclude all Go files" -- which silently took the whole
          # Linux job down once. Cross-compile instead of skipping it.
          (cd tools && GOOS=windows go build ./msgboxcheck)
      - name: native Linux e2e (real kernel, real SSE2)
        run: bash run_tests_linux.sh

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      # Every example, both targets. run_tests.sh delegates goa's own examples
      # to src/goa/run_tests.sh, so there is one definition of that suite.
      #
      # GOC_SKIP_MSGBOX: the GUI example is driven by msgboxcheck, which needs
      # an interactive desktop; runners do not have one. Otherwise the leg is
      # "16 checks: 8 examples x (Windows exe + Linux ELF)", now much larger.
      - name: goc end-to-end
        run: bash run_tests.sh
        env:
          GOC_SKIP_MSGBOX: '1'
