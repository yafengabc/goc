name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Linux: prove every module is gofmt-clean, vets and builds -- including
    # the Windows-only tools, cross-compiled. End-to-end execution is NOT part
    # of CI: compiling and running the examples needs a real Linux kernel and a
    # real Windows desktop, both of which are available locally (see
    # run_tests.sh / run_tests_linux.sh). CI keeps only the checks that need
    # nothing but the toolchain, so a red build always means the source, never
    # the runner's missing kernel feature or absent emulator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: gofmt
        run: |
          # Check the tracked module trees explicitly rather than `.`:
          # `gofmt -l .` also descends into scratch/, which .gitignore excludes
          # as a local scratch area. Gating on files the repo does not track
          # means the job can be red for a reason that exists only on one
          # machine, and there is no way to fix it from a commit.
          out="$(gofmt -l src tools/elfcheck tools/msgboxcheck)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          (cd src/frontend && go vet ./...)
          (cd src/goc && go vet ./...)
          (cd src && go vet ./...)
          (cd src/common && go vet ./...)
          (cd src/gocl && go vet ./...)
          (cd src/gocld && go vet ./...)
          (cd src/goa && go vet ./...)
          (cd tools && go vet ./...)
      - name: go build
        run: |
          mkdir -p bin
          # goc and gocl are both built from the single src/ main package,
          # selected by build tag (-tags goc / -tags gocl). The old commands
          # pointed at src/goc/cmd/goc (removed in the frontend refactor) and
          # built src/ without a tag (no main declared -> build error).
          (cd src && go build -o ../bin/goc -tags goc .)
          (cd src && go build -o ../bin/gocl -tags gocl .)
          (cd src/goa && go build -o ../../bin/goa ./cmd/goa)
          (cd tools && go build -o ../bin/elfcheck ./elfcheck)
          # msgboxcheck drives a real Windows dialog box, so it only exists as
          # a Windows program: building it here without GOOS fails with "build
          # constraints exclude all Go files" -- which silently took the whole
          # Linux job down once. Cross-compile instead of skipping it.
          (cd tools && GOOS=windows go build -o ../bin/msgboxcheck.exe ./msgboxcheck)
          # -o with a real target rather than `go build ./elfcheck`: the latter
          # wants to write a file named elfcheck right beside the directory
          # of the same name, and refuses with 'already exists and is a
          # directory'.

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: "install unicorn (optional: goa's PE emulation test)"
        # tools/peun.py emulates a built PE to prove a switch's jump-table
        # relocations land in the right basic blocks. It needs the unicorn CPU
        # emulator, which no runner ships. Without it the test skips instead of
        # failing, so this is best effort: install the wheel when pip can get
        # it and carry on when it cannot -- a flaky package index must not turn
        # an optional dependency into a red build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install unicorn
        # bash, not the default PowerShell: the windows runner's default shell
        # is pwsh, which parses this block and dies with "Missing opening '('
        # after keyword 'for'" -- PowerShell has its own `for` grammar and no
        # subshell/cd chaining like this.
        continue-on-error: true
        shell: bash
      # Unit tests for every module. The end-to-end suites (run_tests.sh,
      # which compiles and runs all the examples, and run_tests_linux.sh) are
      # deliberately NOT run here -- they execute freshly built binaries, so
      # they belong on a machine with a Linux kernel and a desktop session
      # (that is what the local WSL setup is for), not on a headless runner.
      #
      # gocl's tests that need libLLVM skip themselves when the DLL is absent
      # (it is not in the repo -- it ships as a release asset), so this leg
      # covers the IR construction, which is pure Go, and leaves the actual
      # object emission to the local runs.
      - name: unit tests
        run: |
          set -u
          fail=0
          # Every module is its own go.mod, so each needs its own `go test`.
          # A subshell per module keeps the working directory changes local,
          # and `|| fail=1` (rather than `set -e`) lets the whole list run so
          # one broken module does not hide the others.
          for m in src/frontend src/goc src src/common src/gocl src/gocld src/goa tools; do
            printf '=== %s ===\n' "$m"
            (cd "$m" && go test ./...) || fail=1
          done
          exit $fail
        shell: bash
