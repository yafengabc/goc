name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Linux: prove both modules compile and are gofmt-clean, then RUN the
    # Linux ELF targets on the real kernel (run_tests_linux.sh) -- the only
    # true check for the SSE2 double codegen, no elfcheck interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: gofmt
        run: |
          # Check the tracked module trees explicitly rather than `.`:
          # `gofmt -l .` also descends into scratch/, which .gitignore excludes
          # as a local scratch area. Gating on files the repo does not track
          # means the job can be red for a reason that exists only on one
          # machine, and there is no way to fix it from a commit.
          out="$(gofmt -l src tools/elfcheck tools/msgboxcheck)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          (cd src/frontend && go vet ./...)
          (cd src/goc && go vet ./...)
          (cd src && go vet ./...)
          (cd src/gocld && go vet ./...)
          (cd src/goa && go vet ./...)
          (cd tools && go vet ./...)
      - name: go build
        run: |
          mkdir -p bin
          (cd src/goc && go build -o ../../bin/goc ./cmd/goc)
          (cd src && go build -o ../bin/goc-standalone .)
          (cd src/goa && go build -o ../../bin/goa ./cmd/goa)
          (cd tools && go build -o ../bin/elfcheck ./elfcheck)
          # msgboxcheck drives a real Windows dialog box, so it only exists as
          # a Windows program: building it here without GOOS fails with "build
          # constraints exclude all Go files" -- which silently took the whole
          # Linux job down once. Cross-compile instead of skipping it.
          (cd tools && GOOS=windows go build -o ../bin/msgboxcheck.exe ./msgboxcheck)
          # -o with a real target rather than `go build ./elfcheck`: the latter
          # wants to write a file named elfcheck right beside the directory
          # of the same name, and refuses with 'already exists and is a
          # directory'.
      - name: native Linux e2e (real kernel, real SSE2)
        run: bash run_tests_linux.sh

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      # Windows targets here; Linux targets are the Ubuntu job's, which execs
      # the ELFs on a real kernel instead of relying on this runner having a
      # Python with unicorn. It does not, so run_tests.sh skips that leg with
      # a loud WARNING rather than pretending it passed.
      #
      # Every example, both goals above plus unit tests for all three modules
      # and the assembler's own suite (run_tests.sh delegates to
      # goa/run_tests.sh, so there is one definition of that suite).
      #
      # GOC_SKIP_MSGBOX: the GUI example is driven by msgboxcheck, which needs
      # an interactive desktop; runners do not have one.
      - name: goc end-to-end
        run: bash run_tests.sh
        env:
          GOC_SKIP_MSGBOX: '1'
